name: Build Custom Firmware

on:
  workflow_dispatch: # 允许在 GitHub 网页端手动点击运行
    inputs:
      machine:
        description: '目标设备型号 (MACHINE)'
        required: true
        default: 'DEFAULT_8C_1SFP'
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y make gcc g++ pkg-config bison flex libboost-dev patch bzip2 curl ca-certificates xxd python-is-python3 libjson-c-dev zlib1g-dev

      - name: Cache patched SDCC
        uses: actions/cache@v4
        with:
          path: toolchain
          key: sdcc-${{ hashFiles('sdcc/*') }}

      - name: Build firmware & OEM upgrade image
        env:
          TARGET_MACHINE: ${{ github.event.inputs.machine || 'DEFAULT_8C_1SFP' }}
        run: |
          make MACHINE="$TARGET_MACHINE"
          make -C installer

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtlplayground-firmware
          path: |
            output/**/*.bin
            installer/output/rtlplayground_oem_upgrade.bin
