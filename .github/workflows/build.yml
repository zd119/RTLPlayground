name: Build firmware

on:
  workflow_dispatch: # 支持在网页端手动点击运行
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y make gcc g++ pkg-config bison flex libboost-dev patch bzip2 curl ca-certificates xxd python-is-python3 libjson-c-dev zlib1g-dev

      - name: Cache the patched SDCC
        uses: actions/cache@v4
        with:
          path: toolchain
          key: sdcc-${{ hashFiles('sdcc/*') }}

      - name: Make project (4x2/RTL8372 - KP_9000_6XHML_X2)
        run: |
          make MACHINE="KEEPLINK_KP_9000_6XHML_X2_2M_PCB43_V1_1" LANGUAGE=zh OUTPUT_DIR=release_bin

      - name: Make project (8x1/RTL8373 - KP_9000_9XHML_X)
        run: |
          make clean
          make MACHINE="KEEPLINK_KP_9000_9XHML_X_2M_PCB23_V3_1" LANGUAGE=zh OUTPUT_DIR=release_bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-perfect-zh-firmware
          path: release_bin/*.bin
