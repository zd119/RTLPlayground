name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 libjson-c-dev zlib1g-dev -y

      - name: Run the host-side unit tests
        run: make -C test

      - name: Check that every machine definition can be compiled
        run: make machine_check

      - name: Make project (海圣 HI-K0402WS V2.0 专属)
        # 👈 这里已修正为官方定义的海圣 K0402WS V2.0 专属机器名，确保网口数量不多不少，刚刚好 4+2
        run: make clean && make CI=1 MACHINE="hisource_hi_k0402ws_v2" LANGUAGE=zh

      - name: Make project (8x1/RTL8373)
        run: make clean && make CI=1 MACHINE="KP_9000_9XHML_X_V3_1"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-perfect-zh-firmware
          path: |
            *.bin
            firmware/
            output/
