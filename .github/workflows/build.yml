name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 libjson-c-dev zlib1g-dev -y

      - name: Run the host-side unit tests
        run: make -C test

      - name: Check that every machine definition can be compiled
        run: make machine_check

      - name: Make project (海圣 4+2 专属中文版)
        # 1. 先编译出全中文界面的固件，并把重命名出来的 bin 文件保护起来防止被覆盖
        run: |
          make clean
          make CI=1 MACHINE="HI_K0402WS" LANGUAGE=zh
          mv firmware.bin firmware_zh.bin || true
          mv output/firmware.bin output/firmware_zh.bin || true

      - name: Make project (海圣 4+2 专属英文版)
        # 2. 再编译一个原汁原味的英文版固件，两者共存
        run: |
          make clean
          make CI=1 MACHINE="HI_K0402WS"
          mv firmware.bin firmware_en.bin || true
          mv output/firmware.bin output/firmware_en.bin || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-perfect-zh-firmware
          path: |
            *.bin
            firmware/
            output/
